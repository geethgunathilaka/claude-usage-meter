name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$v" -o claude-usage-meter.exe .
          go build -trimpath -ldflags "-s -w" -o claude-usage-report.exe ./cmd/claude-usage-report

      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-meter
          path: "*.exe"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            claude-usage-meter.exe
            claude-usage-report.exe
          generate_release_notes: true
